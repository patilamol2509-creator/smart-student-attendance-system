name: Build Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Add CameraX provider
        run: git clone --depth 1 https://github.com/Android-for-Python/camerax_provider.git

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run unit tests and syntax checks
        run: |
          python -m pip install "qrcode[pil]"
          python -m compileall -q main.py attendance_db.py qr_utils.py tests
          python -m unittest discover -s tests -v

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Buildozer system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ccache git libffi-dev libncurses5-dev \
            libncursesw5-dev libssl-dev libsqlite3-dev python3-dev \
            unzip zip zlib1g-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install "Cython==0.29.36" "buildozer==1.5.0"

      - name: Cache Android build downloads
        uses: actions/cache@v4
        with:
          path: |
            .buildozer
            ~/.buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      - name: Build debug APK
        run: buildozer -v android debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: smart-student-attendance-debug-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14
